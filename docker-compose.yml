services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    restart: unless-stopped
    # Bound exclusively to your Tailscale IP. 
    # Only devices authenticated on your Tailscale network can see the ERP on port 3000.
    ports:
      - "${TAILSCALE_PORT}:3000:3000"
    
    # Injects the app-specific variables (like DATABASE_URL) directly into the container
    env_file:
      - ./app/.env 
    environment:
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - JWT_SECRET=${JWT_SECRET}
      - SIGNUP_KEY=${SIGNUP_KEY:-epi-key}
    networks:
      - school_network
    depends_on:
      db:
        # Forces the app to wait until Postgres is fully initialized before booting
        condition: service_healthy
      minio:
        condition: service_started

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # Bound to Tailscale IP. You can now securely connect your local 
    # pgAdmin/DBeaver directly to the production database over the VPN!
    ports:
      - "${TAILSCALE_PORT}:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_USER:-postgres}
    volumes:
      - ./volumes/pgdata:/var/lib/postgresql/data
      # - ./db/init:/docker-entrypoint-initdb.d
    networks:
      - school_network
    # Healthcheck ensures the DB is accepting connections before Next.js/Prisma boots up
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    # Bound to Tailscale IP so you can securely access the Minio web console
    ports:
      - "${TAILSCALE_PORT}:${MINIO_PORT:-9000}:9000"
      - "${TAILSCALE_PORT}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ./volumes/miniodata:/data
    networks:
      - school_network

networks:
  school_network:
    driver: bridge
