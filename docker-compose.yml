services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    restart: unless-stopped
    # App port is NOT exposed to the host.
    # Cloudflared will route traffic internally directly to port 3000.
    
    # Injects the app-specific variables (like DATABASE_URL) directly into the container
    env_file:
      - ./app/.env 
    networks:
      - school_network
    depends_on:
      db:
        # Forces the app to wait until Postgres is fully initialized before booting
        condition: service_healthy
      minio:
        condition: service_started

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # Bound to localhost (127.0.0.1) to prevent external local-network access,
    # keeping the database accessible only to the server admin and Docker containers.
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_USER:-postgres}
    volumes:
      - ./volumes/pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    networks:
      - school_network
    # Healthcheck ensures the DB is accepting connections before Next.js/Prisma boots up
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ./volumes/miniodata:/data
    networks:
      - school_network

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN}
    networks:
      - school_network
    depends_on:
      - app

networks:
  school_network:
    driver: bridge
